[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pump-sizer"
version = "0.1.0"
description = "Meanline sizer for few-kN LOX/RP-1 and LOX/ethanol pump-fed engines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pump-sizer = "pump_sizer.cli:main"
pump-sizer-ui = "pump_sizer.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
